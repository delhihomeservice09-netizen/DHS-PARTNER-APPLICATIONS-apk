name: DHS Partner Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$ZIP_FILE" -d build-src
          chmod -R u+rwX build-src

          echo "ZIP extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find build-src -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Android build.gradle
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Replace the broken one-line buildTypes block
          # with a correctly separated release/debug block.
          pattern = r'buildTypes\s*\{.*?\n?\s*\}'

          replacement = '''buildTypes {
              release {
                  minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
              }

              debug {
                  minifyEnabled false
              }
          }'''

          match = re.search(pattern, text, re.S)

          if match:
              text = text[:match.start()] + replacement + text[match.end():]
          else:
              raise SystemExit("ERROR: buildTypes block not found")

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("buildTypes fixed successfully.")
          PY

          echo "----- FINAL buildTypes -----"
          grep -A12 -B2 "buildTypes" "$FILE"

      - name: Build RELEASE APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleRelease
          else
            gradle --no-daemon clean assembleRelease
          fi

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: DHS-Partner-v8.20.8-RELEASE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
