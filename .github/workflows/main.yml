name: DHS Partner Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$ZIP_FILE" -d build-src
          chmod -R u+rwX build-src

          echo "ZIP extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find build-src -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Android build.gradle
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/app/build.gradle"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          start = text.find("buildTypes")

          if start == -1:
              raise SystemExit("ERROR: buildTypes block not found")

          brace_start = text.find("{", start)

          depth = 0
          end = -1

          for i in range(brace_start, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end == -1:
              raise SystemExit("ERROR: buildTypes block incomplete")

          replacement = """buildTypes {
              release {
                  minifyEnabled false
                  signingConfig signingConfigs.debug
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
              }

              debug {
                  minifyEnabled false
              }
          }"""

          text = text[:start] + replacement + text[end:]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Release signing configuration added.")
          PY

      - name: Build SIGNED RELEASE APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleRelease
          else
            gradle --no-daemon clean assembleRelease
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK created:"
          ls -lh "$APK"

          echo "Checking APK signature..."
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Rename APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" -print -quit)

          cp "$APK" "$PROJECT_DIR/app/build/outputs/apk/release/DHS-Partner-v8.20.8-SIGNED.apk"

      - name: Upload SIGNED APK
        uses: actions/upload-artifact@v4
        with:
          name: DHS-Partner-v8.20.8-SIGNED
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/DHS-Partner-v8.20.8-SIGNED.apk
          if-no-files-found: error
